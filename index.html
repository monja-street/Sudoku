<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <!-- PWA用設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css?v=5.0">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>

    <!-- 1. 最上段：難易度 ＆ 問題入力 -->
    <div class="button-container">
        <div class="mode-row">
            <button id="btn-diff-easy" onclick="setDifficulty('easy')">EASY</button>
            <button id="btn-diff-normal" onclick="setDifficulty('normal')">NORMAL</button>
            <button id="btn-diff-hard" onclick="setDifficulty('hard')">HARD</button>
            <button id="btn-edit" onclick="toggleEditMode()">問題入力</button>
            <span id="edit-cancel-container" style="display: none;">
                <button onclick="cancelEditMode()">中止</button>
            </span>
        </div>
    </div>

    <!-- 2. 中段：基本操作 ＋ 数字キー -->
    <div id="controls">
        <div class="action-row">
            <button onclick="undo()">戻す</button>
            <button id="btn-memo" onclick="handleMemoToggle()">メモ: OFF</button>
            <button onclick="handleErase()">消去</button>
            <button onclick="giveHint()">ヒント</button>
            <button onclick="newGame()">New Game</button>
        </div>

        <div class="number-row">
            <button id="btn-num-1" onclick="handleNumberInput(1)">1</button>
            <button id="btn-num-2" onclick="handleNumberInput(2)">2</button>
            <button id="btn-num-3" onclick="handleNumberInput(3)">3</button>
            <button id="btn-num-4" onclick="handleNumberInput(4)">4</button>
            <button id="btn-num-5" onclick="handleNumberInput(5)">5</button>
            <button id="btn-num-6" onclick="handleNumberInput(6)">6</button>
            <button id="btn-num-7" onclick="handleNumberInput(7)">7</button>
            <button id="btn-num-8" onclick="handleNumberInput(8)">8</button>
            <button id="btn-num-9" onclick="handleNumberInput(9)">9</button>
        </div>
    </div>

    <!-- ヒント解説表示用メッセージボックス -->
    <div id="hint-message-box" class="hint-box" style="display: none;"></div>

    <!-- 3. 下段：キャンバス領域 -->
    <div id="canvas-container"></div>

    <script src="sketch.js?v=5.0"></script>
</body>
</html>
